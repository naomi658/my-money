<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C5CFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="나의 가계부">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=1">
<title>나의 가계부</title>
<style>
  html{-webkit-text-size-adjust:100%}
  @media (max-width:600px){
    input[type=text],input[type=date],input[type=time],select,textarea{font-size:16px !important}
    #enAmount{font-size:27px !important}
  }
  :root{
    --purple:#7C5CFF; --purple-deep:#5A3BE0; --purple-dim:#9B84FF; --purple-soft:#F1EDFF;
    --ink:#191527; --ink2:#615B78; --ink3:#9C96B0; --line:#ECE9F4;
    --bg:#F6F5FA; --card:#fff;
    --up:#12A87B; --down:#F0555F; --warn:#F2A63B;
    --r:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Helvetica Neue","Malgun Gothic",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; word-break:keep-all}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom)); font-size:14px}
  body.has-fab{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
  button{font-family:inherit}
  #app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 50px rgba(50,35,120,.07)}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:30;background:rgba(246,245,250,.94);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid transparent}
  header.shadow{border-bottom-color:var(--line)}
  .hrow{display:flex;align-items:center;gap:8px;min-height:34px}
  .htitle{font-size:21px;font-weight:800;letter-spacing:-.5px;margin:0}
  .hspacer{flex:1}
  .hbtn{border:none;background:#fff;color:var(--purple-deep);width:36px;height:36px;border-radius:12px;
    display:grid;place-items:center;box-shadow:0 1px 3px rgba(60,40,140,.09);font-size:15px;font-weight:800;cursor:pointer}
  .hbtn:active{transform:scale(.94)}
  .hbtn svg{width:19px;height:19px}
  .monthnav{display:flex;align-items:center;gap:2px;margin:6px 0 0}
  .monthnav .nav{border:none;background:transparent;color:var(--ink2);width:30px;height:30px;font-size:17px;border-radius:9px;cursor:pointer}
  .monthnav .nav:active{background:#EDEAF7}
  .monthnav .m{font-size:15px;font-weight:800;letter-spacing:-.3px;padding:0 4px;min-width:104px;text-align:center;
    border:none;background:transparent;color:var(--ink);cursor:pointer}
  .monthnav .today-chip{border:1px solid var(--line);background:#fff;color:var(--purple-deep);font-size:11px;
    font-weight:700;border-radius:999px;padding:4px 9px;cursor:pointer}

  /* ---------- layout ---------- */
  main{padding:8px 14px 20px}
  .card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0;
    box-shadow:0 1px 3px rgba(40,30,90,.055)}
  .card h3{margin:0 0 10px;font-size:14px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
  .card h3 .r{margin-left:auto;font-size:11.5px;color:var(--ink3);font-weight:600}
  .sechead{display:flex;align-items:center;gap:8px;margin:18px 2px 8px}
  .sechead h3{margin:0;font-size:14px;font-weight:800;letter-spacing:-.2px}
  .sechead .cnt{font-size:11.5px;color:var(--ink3);font-weight:600}
  .sechead .linkbtn{margin-left:auto;border:none;background:transparent;color:var(--purple-deep);font-size:12px;font-weight:700;padding:4px 2px;cursor:pointer}
  .muted{color:var(--ink3);font-size:12px}
  .up{color:var(--up)} .down{color:var(--down)}

  /* ---------- month summary ---------- */
  .sumcard{background:linear-gradient(160deg,#ffffff 0%,#FBFAFF 100%);border-radius:20px;padding:14px 14px 12px;
    margin:8px 0 10px;box-shadow:0 2px 8px rgba(40,30,90,.06);border:1px solid #F1EEFA}
  .sumgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .sumgrid .col{min-width:0}
  .sumgrid .lab{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:-.1px}
  .sumgrid .val{font-size:clamp(14px,4.3vw,16.5px);font-weight:800;letter-spacing:-.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sumgrid .val.up{color:var(--up)} .sumgrid .val.down{color:var(--down)}
  .nwline{display:flex;align-items:center;gap:6px;margin-top:11px;padding-top:10px;border-top:1px dashed #EBE6F8;
    font-size:12px;color:var(--ink2);cursor:pointer;width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left}
  .nwline b{margin-left:auto;font-size:13.5px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
  .nwline .chev{color:#C9C2DC;font-size:15px;margin-left:2px}

  /* budget */
  .budgetbox{margin-top:11px;padding-top:11px;border-top:1px dashed #EBE6F8}
  .barrow{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ink2);font-weight:600;margin-bottom:5px}
  .barrow b{font-size:12px;font-weight:800;color:var(--ink)}
  .track{height:7px;border-radius:99px;background:#EFEBF9;overflow:hidden}
  .track > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8E6DFF,#6A45F5);transition:width .3s}
  .track > i.over{background:linear-gradient(90deg,#FF8A6B,#F0555F)}
  .track.slim{height:5px}

  /* ---------- calendar ---------- */
  .calcard{background:#fff;border-radius:20px;padding:10px 8px 8px;box-shadow:0 1px 3px rgba(40,30,90,.055)}
  .calrow{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink3);padding:1px 0 5px}
  .dow.sun{color:#E0655F} .dow.sat{color:#5B8DEF}
  .cell{position:relative;border:none;background:transparent;border-radius:11px;padding:4px 0 3px;min-height:42px;
    display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;overflow:hidden}
  .cell .num{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.25}
  .cell.other .num{color:#D2CCE0;font-weight:600}
  .cell.sun .num{color:#E0655F} .cell.sat .num{color:#5B8DEF}
  .cell .ex{font-size:8.5px;font-weight:800;color:var(--down);line-height:1.15;letter-spacing:-.3px;max-width:100%;white-space:nowrap}
  .cell .in{font-size:8.5px;font-weight:800;color:var(--up);line-height:1.15;letter-spacing:-.3px;max-width:100%;white-space:nowrap}
  .cell.today{box-shadow:inset 0 0 0 1.6px var(--purple)}
  .cell.today .num{color:var(--purple-deep)}
  .cell.sel{background:linear-gradient(150deg,#8A6AFF,#6A45F5);box-shadow:0 3px 8px rgba(106,69,245,.28)}
  .cell.sel .num,.cell.sel .ex,.cell.sel .in{color:#fff}

  /* ---------- day list ---------- */
  .dayhead{display:flex;align-items:baseline;gap:8px;margin:16px 3px 8px}
  .dayhead h3{margin:0;font-size:14.5px;font-weight:800;letter-spacing:-.2px}
  .dayhead .sum{margin-left:auto;font-size:11.5px;color:var(--ink2);font-weight:600;display:flex;gap:8px}
  .txlist{list-style:none;margin:0;padding:0;background:#fff;border-radius:18px;overflow:hidden;
    box-shadow:0 1px 3px rgba(40,30,90,.055)}
  .txlist li{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}
  .txlist li:last-child{border-bottom:none}
  .txlist li:active{background:#FAF8FF}
  .txic{width:37px;height:37px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:0 0 auto;background:#F1EDFF}
  .txmain{flex:1;min-width:0}
  .txname{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:5px;letter-spacing:-.2px}
  .txname .tag{font-size:10px;font-weight:700;color:var(--ink3);background:#F4F2FA;border-radius:5px;padding:1px 5px}
  .txmemo{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .txamt{font-size:14px;font-weight:800;text-align:right;letter-spacing:-.3px;flex:0 0 auto}
  .txamt.up{color:var(--up)}
  .txamt.move{color:var(--purple-deep);font-size:12.5px;font-weight:700}
  .empty{background:#fff;border-radius:18px;padding:26px 16px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.6;
    box-shadow:0 1px 3px rgba(40,30,90,.055)}
  .empty b{display:block;color:var(--ink2);font-size:13.5px;margin-bottom:3px}

  .samplebanner{display:flex;align-items:flex-start;gap:8px;background:#FFF6E8;border:1px solid #F8E3BE;color:#8A6520;
    border-radius:14px;padding:10px 12px;font-size:11.5px;line-height:1.45;margin:2px 0 8px}
  .samplebanner b{font-weight:800}
  .samplebanner .txt{flex:1;min-width:0;word-break:keep-all}
  .samplebanner button{margin-left:auto;flex:0 0 auto;border:none;background:#8A6520;color:#fff;font-size:11px;font-weight:700;
    border-radius:9px;padding:7px 10px;cursor:pointer}

  /* ---------- hero / assets ---------- */
  .hero{position:relative;border-radius:22px;padding:17px 18px 15px;color:#fff;overflow:hidden;
    background:linear-gradient(135deg,#8A6AFF 0%,#6A45F5 52%,#4B28CF 100%);box-shadow:0 12px 26px rgba(89,58,220,.28);margin:8px 0 10px}
  .hero:after{content:"";position:absolute;right:-46px;top:-66px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.13)}
  .hero:before{content:"";position:absolute;left:-30px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.07)}
  .hero .lab{font-size:12px;opacity:.88;font-weight:600;letter-spacing:.1px;display:flex;align-items:center;gap:5px}
  .hero .big{font-size:clamp(21px,7.5vw,30px);font-weight:800;letter-spacing:-1.2px;margin:5px 0 9px;position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero .chips{display:flex;gap:16px;font-size:11.5px;position:relative;z-index:1;opacity:.95}
  .hero .chips span{display:flex;flex-direction:column;gap:2px}
  .hero .chips i{font-style:normal;opacity:.72;font-size:10.5px}
  .hero .chips b{font-weight:800;font-size:13px;letter-spacing:-.2px}
  .hero .chg{display:inline-block;margin-top:11px;background:rgba(255,255,255,.18);border-radius:999px;
    padding:5px 10px;font-size:11px;font-weight:700;position:relative;z-index:1}

  .accrow{display:flex;align-items:center;gap:11px;width:100%;background:#fff;border:none;border-radius:16px;
    padding:11px 13px;margin-bottom:7px;box-shadow:0 1px 3px rgba(40,30,90,.05);text-align:left;cursor:pointer}
  .accrow .chev{color:#CFC9DE;font-size:15px;margin-left:2px;flex:0 0 auto}
  .accrow .ic{width:37px;height:37px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:#F3F0FC;flex:0 0 auto}
  .accmain{flex:1;min-width:0}
  .accmain b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .accmain span{font-size:11px;color:var(--ink3)}
  .accamt{text-align:right;flex:0 0 auto}
  .accamt b{display:block;font-size:14px;font-weight:800;letter-spacing:-.3px}
  .accamt.liab b{color:var(--down)}
  .paybtn{border:none;background:var(--purple-soft);color:var(--purple-deep);font-size:11px;font-weight:800;
    border-radius:9px;padding:7px 9px;margin-left:6px;cursor:pointer}

  /* ---------- stats ---------- */
  .stathero{background:#fff;border-radius:20px;padding:15px;margin:8px 0 10px;box-shadow:0 1px 3px rgba(40,30,90,.055)}
  .stathero .lab{font-size:11.5px;color:var(--ink3);font-weight:700}
  .stathero .big{font-size:clamp(20px,6.6vw,26px);font-weight:800;letter-spacing:-.9px;margin:2px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stathero .sub{display:flex;gap:12px;font-size:11.5px;color:var(--ink2);flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px}
  .badge.up{background:#E8F7F1;color:#0E8E68}
  .badge.down{background:#FDEDEE;color:#D63B46}
  .badge.flat{background:#F2F0F8;color:#7A7490}
  .donutwrap{display:flex;align-items:center;gap:14px}
  .donutwrap svg{flex:0 0 auto}
  .legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .legend .li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);font-weight:600}
  .legend .dot{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
  .legend .li b{margin-left:auto;font-weight:800;color:var(--ink);font-size:11.5px}
  .catrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F3F0FA}
  .catrow:last-child{border-bottom:none}
  .catrow .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
  .catmain{flex:1;min-width:0}
  .catmain .top{display:flex;align-items:baseline;gap:6px}
  .catmain .top b{font-size:13px;font-weight:700}
  .catmain .top span{margin-left:auto;font-size:12.5px;font-weight:800;letter-spacing:-.2px}
  .catmain .track{margin-top:5px}
  .catrow .pct{width:34px;text-align:right;font-size:11px;color:var(--ink3);font-weight:700}
  .chartbox{margin:2px 0 0;overflow:hidden}
  .chartbox svg{width:100%;height:auto;display:block}
  .nwlist{list-style:none;margin:8px 0 0;padding:0}
  .nwlist li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #F4F1FB;font-size:12.5px}
  .nwlist li:last-child{border-bottom:none}
  .nwlist .m{color:var(--ink2);font-weight:600;width:64px}
  .nwlist .v{font-weight:800;letter-spacing:-.2px}
  .nwlist .d{margin-left:auto;font-size:11.5px;font-weight:700}

  /* ---------- settings ---------- */
  .sgroup{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 1px 3px rgba(40,30,90,.055);margin:10px 0}
  .srow{display:flex;align-items:center;gap:11px;width:100%;border:none;background:#fff;padding:14px 14px;
    border-bottom:1px solid var(--line);text-align:left;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
  .srow:last-child{border-bottom:none}
  .srow:active{background:#FAF8FF}
  .srow .em{font-size:17px;width:22px;text-align:center;flex:0 0 auto}
  .srow .sub{display:block;font-size:11px;color:var(--ink3);font-weight:500;margin-top:2px}
  .srow .chev{margin-left:auto;color:#CFC9DE;font-size:15px}
  .srow.danger{color:#D63B46}
  .infotext{margin:8px 4px 0;font-size:11.5px;color:var(--ink3);line-height:1.65}
  .infotext b{color:var(--ink2)}

  /* ---------- tabbar / fab ---------- */
  #tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.95);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  .tabinner{max-width:560px;margin:0 auto;display:flex}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border:none;background:none;
    color:#A8A2BC;font-size:10.5px;font-weight:700;cursor:pointer}
  .tab svg{width:23px;height:23px}
  .tab.on{color:var(--purple-deep)}
  #fab{position:fixed;z-index:35;right:max(14px, calc(50% - 266px));bottom:calc(80px + env(safe-area-inset-bottom));
    width:54px;height:54px;border-radius:19px;border:none;background:linear-gradient(140deg,#8E6DFF,#6A45F5);
    color:#fff;box-shadow:0 10px 22px rgba(106,69,245,.38);display:grid;place-items:center;cursor:pointer}
  #fab svg{width:26px;height:26px}
  #fab:active{transform:scale(.95)}

  /* ---------- sheet ---------- */
  #sheetRoot{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
  .sheet-bg{position:absolute;inset:0;background:rgba(19,12,40,.45)}
  .sheet-card{position:relative;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;background:var(--bg);
    border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:sheetup .26s cubic-bezier(.22,.85,.3,1)}
  @keyframes sheetup{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .sheet-bg{animation:fadein .2s}
  .sheet-grab{width:38px;height:4px;border-radius:99px;background:#DDD7EC;margin:8px auto 2px;flex:0 0 auto}
  .sheet-head{display:flex;align-items:center;gap:8px;padding:6px 16px 8px;flex:0 0 auto}
  .sheet-head h2{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.3px}
  .sheet-head .sub{font-size:11.5px;color:var(--ink3);font-weight:600}
  .sheet-head .x{margin-left:auto;border:none;background:#EDEAF7;color:var(--ink2);width:30px;height:30px;border-radius:50%;
    font-size:15px;display:grid;place-items:center;cursor:pointer}
  .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 14px;flex:1 1 auto}
  .sheet-foot{flex:0 0 auto;padding:9px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(246,245,250,.96);
    border-top:1px solid var(--line);display:flex;gap:8px}
  .btn{border:none;border-radius:14px;padding:14px 18px;font-size:14.5px;font-weight:800;cursor:pointer;letter-spacing:-.2px}
  .btn.primary{background:linear-gradient(140deg,#8A6AFF,#6A45F5);color:#fff;flex:1;box-shadow:0 6px 16px rgba(106,69,245,.28)}
  .btn.primary:disabled{background:#D7D1E8;box-shadow:none;color:#fff}
  .btn.soft{background:#EFEBFA;color:var(--purple-deep)}
  .btn.danger{background:#FDECEE;color:#D63B46}
  .btn.wide{flex:1}
  .btn.small{padding:10px 12px;font-size:12.5px;border-radius:11px}
  .seg{display:flex;background:#EBE7F6;border-radius:13px;padding:3px;gap:3px;margin-top:4px}
  .seg button{flex:1;border:none;background:transparent;padding:9px 0;border-radius:10px;font-size:13.5px;
    font-weight:800;color:var(--ink2);cursor:pointer;letter-spacing:-.2px}
  .seg button.on{background:#fff;color:var(--purple-deep);box-shadow:0 1px 4px rgba(60,40,140,.14)}
  .field{margin:11px 0}
  .field > label{display:block;font-size:12px;font-weight:800;color:var(--ink2);margin:0 0 6px 2px;letter-spacing:-.1px}
  input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
    width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 12px;font-size:15px;
    color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;font-family:inherit}
  input[type=checkbox]{accent-color:var(--purple);width:auto;min-width:20px;height:20px}
  input:focus,select:focus,textarea:focus{border-color:var(--purple-dim);box-shadow:0 0 0 3px rgba(124,92,255,.1)}
  select{background-image:linear-gradient(45deg,transparent 50%,#9C96B0 50%),linear-gradient(135deg,#9C96B0 50%,transparent 50%);
    background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
    padding-right:34px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .amtbox{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:17px;
    padding:9px 14px;margin-top:10px}
  .amtbox input{flex:1;border:none;outline:none;font-size:27px;font-weight:800;text-align:right;letter-spacing:-.8px;
    background:transparent;min-width:0;padding:0;border-radius:0;box-shadow:none}
  .amtbox .cur{font-size:15px;color:var(--ink2);font-weight:800}
  .quickamts{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
  .quickamts::-webkit-scrollbar{display:none}
  .quickamts button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:11.5px;
    font-weight:700;border-radius:999px;padding:7px 9px;cursor:pointer}
  .catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:2px}
  .catgrid button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:7px 3px 6px;display:flex;
    flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--ink2);line-height:1.2;
    cursor:pointer;letter-spacing:-.2px;overflow:hidden}
  .catgrid button .em{font-size:17px;line-height:1.1}
  .catgrid button.on{border-color:var(--purple);background:var(--purple-soft);color:var(--purple-deep);
    box-shadow:inset 0 0 0 1px var(--purple)}
  .listrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #F1EDF9}
  .listrow:last-child{border-bottom:none}
  .listrow .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;background:#F3F0FC;flex:0 0 auto}
  .listrow .main{flex:1;min-width:0}
  .listrow .main b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .listrow .main span{font-size:11px;color:var(--ink3)}
  .listrow .amt{font-size:13.5px;font-weight:800;letter-spacing:-.2px}
  .iconmini{border:none;background:#F3F0FC;color:var(--ink2);width:29px;height:29px;border-radius:9px;font-size:13px;
    display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
  .swi{position:relative;width:42px;height:25px;border-radius:99px;background:#DCD6EA;border:none;flex:0 0 auto;cursor:pointer}
  .swi:after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;
    transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .swi.on{background:var(--purple)}
  .swi.on:after{left:20px}
  .chips2{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
  .chips2 button{border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:12px;font-weight:700;
    border-radius:999px;padding:7px 12px;cursor:pointer}
  .chips2 button.on{background:var(--purple);border-color:var(--purple);color:#fff}
  .emptysmall{text-align:center;color:var(--ink3);font-size:12.5px;padding:18px 6px;line-height:1.6}
  .mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mapgrid .field{margin:6px 0}
  .mapgrid select{font-size:13px;padding:10px 30px 10px 10px;background-position:calc(100% - 15px) 17px,calc(100% - 10px) 17px}
  .preview{background:#fff;border-radius:13px;padding:10px;font-size:11.5px;color:var(--ink2);line-height:1.7;
    max-height:120px;overflow:auto;border:1px solid var(--line);margin-top:6px}
  .preview .r{display:flex;gap:6px;padding:2px 0;border-bottom:1px dashed #F2EFFA}
  .preview .r:last-child{border-bottom:none}
  .preview .r .d{color:var(--ink3);width:74px;flex:0 0 auto}
  .preview .r .a{margin-left:auto;font-weight:700}
  .note{background:#FFF8EC;border:1px solid #F6E3C2;color:#8A6520;border-radius:12px;padding:9px 11px;
    font-size:11.5px;line-height:1.55;margin:8px 0}

  /* ---------- onboarding ---------- */
  #onboard{position:fixed;inset:0;z-index:90;background:linear-gradient(170deg,#7C5CFF 0%,#5B3BE0 45%,#3B1FA8 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center}
  .obcard{max-width:380px;width:100%}
  .oblogo{width:84px;height:84px;border-radius:26px;background:rgba(255,255,255,.16);display:grid;place-items:center;
    margin:0 auto 18px;font-size:40px;box-shadow:0 10px 30px rgba(0,0,0,.15);overflow:hidden}
  .oblogo img{width:100%;height:100%;object-fit:cover}
  #onboard h1{font-size:25px;margin:0 0 8px;letter-spacing:-.7px;font-weight:800}
  #onboard p{font-size:13px;line-height:1.65;opacity:.9;margin:0 0 22px}
  #onboard .obbtns{display:flex;flex-direction:column;gap:8px}
  #onboard .ob1{border:none;border-radius:15px;padding:15px;background:#fff;color:var(--purple-deep);font-size:14.5px;font-weight:800;cursor:pointer}
  #onboard .ob2{border:1px solid rgba(255,255,255,.45);border-radius:15px;padding:15px;background:transparent;color:#fff;
    font-size:14.5px;font-weight:700;cursor:pointer}
  #onboard .fine{font-size:10.5px;opacity:.65;margin-top:16px;line-height:1.6}

  .recbanner{display:flex;align-items:center;gap:8px;background:#F3EFFF;border:1px solid #DDD2FF;color:#5A3BE0;
    border-radius:14px;padding:10px 12px;font-size:11.5px;font-weight:600;margin:0 0 8px;line-height:1.45}
  .recbanner b{font-weight:800}
  .recbanner button{margin-left:auto;flex:0 0 auto;border:none;background:var(--purple);color:#fff;font-size:11px;
    font-weight:800;border-radius:9px;padding:7px 10px;cursor:pointer}
  .cfwrap{position:fixed;inset:0;z-index:120;background:rgba(19,12,40,.5);display:flex;align-items:center;
    justify-content:center;padding:22px;animation:fadein .15s}
  .cfbox{background:#fff;border-radius:20px;padding:18px;max-width:330px;width:100%;box-shadow:0 16px 40px rgba(20,10,50,.25)}
  .cfbox h3{margin:0 0 7px;font-size:15.5px;font-weight:800;letter-spacing:-.3px}
  .cfbox p{margin:0;font-size:12.5px;line-height:1.6;color:var(--ink2)}
  .cfbtns{display:flex;gap:8px;margin-top:15px}
  .cfbtns .btn{flex:1;padding:12px;font-size:13.5px}
  #toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
    background:rgba(27,20,48,.93);color:#fff;font-size:12.5px;font-weight:600;padding:11px 16px;border-radius:13px;
    z-index:100;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;max-width:86%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
